name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 收集静态文件：排除版本库 / 工作流 / 本地工作目录 / 构建目录，
      # 新增的 html 或资源（含子目录）会自动带上
      - name: Collect static files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.workbuddy' --exclude='_site' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
