<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>黑洞 · 太阳耀斑 · 太阳系</title>
<style>
  :root { --fg: #e9e2d6; --dim: rgba(233,226,214,.55); --line: rgba(233,226,214,.18); --accent: #ffb86b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .ui { position: fixed; transition: opacity .6s ease; user-select: none; -webkit-user-select: none; }
  body.immersed .ui { opacity: 0; pointer-events: none; }
  body.immersed canvas { cursor: none; }

  #title { top: 28px; left: 32px; pointer-events: none; }
  #title h1 { margin: 0; font-weight: 200; font-size: 26px; letter-spacing: .5em; }
  #title p { margin: 8px 0 0; font-size: 11px; letter-spacing: .28em; color: var(--dim); text-transform: uppercase; }

  #panel { top: 24px; right: 24px; width: 252px; padding: 16px; border: 1px solid var(--line);
    background: rgba(8,7,6,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 4px; }
  .row + .row { margin-top: 14px; }
  body:not([data-scene="0"]) .bh-only, body:not([data-scene="1"]) .sun-only, body:not([data-scene="2"]) .sol-only { display: none; }
  #labels span { position: fixed; left: 0; top: 0; font-size: 11px; letter-spacing: .14em; color: var(--dim); cursor: pointer;
    white-space: nowrap; padding: 2px 4px; user-select: none; -webkit-user-select: none; text-shadow: 0 0 4px #000; }
  #labels span:hover, #labels span.on { color: var(--accent); }
  body:not([data-scene="2"]) #labels, body.nolabels #labels { display: none; }
  .label { font-size: 10px; letter-spacing: .22em; color: var(--dim); margin-bottom: 7px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .seg button { flex: 1; }
  button { appearance: none; background: transparent; color: var(--dim); border: 0; padding: 8px 4px;
    font: inherit; font-size: 12px; letter-spacing: .08em; cursor: pointer; transition: background .2s, color .2s; }
  button:hover { color: var(--fg); }
  button[aria-pressed="true"] { background: rgba(255,184,107,.16); color: var(--accent); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  .seg button + button { border-left: 1px solid var(--line); }
  #fs, #fire { width: 100%; border: 1px solid var(--line); border-radius: 3px; color: var(--fg); letter-spacing: .2em; }
  #fs:hover, #fire:hover { border-color: var(--accent); color: var(--accent); }

  #readout { left: 32px; bottom: 26px; font: 11px/1.9 ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim);
    pointer-events: none; letter-spacing: .06em; }
  #readout b { color: var(--fg); font-weight: 400; }
  #hint { right: 28px; bottom: 26px; font-size: 11px; letter-spacing: .16em; color: var(--dim); pointer-events: none; text-align: right; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 32px; text-align: center; font-size: 14px; line-height: 1.8; }
  @media (max-width: 640px) {
    #title { top: 16px; left: 16px; } #title h1 { font-size: 18px; } #title p { display: none; }
    #panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; }
    #readout { top: 52px; bottom: auto; left: 16px; } #hint { display: none; }
  }
</style>
</head>
<body data-scene="0">
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="title" class="ui">
  <h1 id="t1">卡冈图雅</h1>
  <p id="t2">Schwarzschild null-geodesic ray tracing</p>
</div>

<div id="panel" class="ui">
  <div class="row">
    <div class="label">场景</div>
    <div class="seg" id="scene">
      <button data-v="0" aria-pressed="true">黑洞</button>
      <button data-v="1" aria-pressed="false">太阳耀斑</button>
      <button data-v="2" aria-pressed="false">太阳系</button>
    </div>
  </div>
  <div class="row bh-only">
    <div class="label">显示模式</div>
    <div class="seg" id="mode">
      <button data-v="1" aria-pressed="true">电影</button>
      <button data-v="0" aria-pressed="false">真实物理</button>
    </div>
  </div>
  <div class="row bh-only">
    <div class="label">吸积盘转动</div>
    <div class="seg" id="spin">
      <button data-v="1" aria-pressed="true">开</button>
      <button data-v="0" aria-pressed="false">关</button>
    </div>
  </div>
  <div class="row sun-only">
    <div class="label">自动喷发</div>
    <div class="seg" id="auto">
      <button data-v="1" aria-pressed="true">开</button>
      <button data-v="0" aria-pressed="false">关</button>
    </div>
  </div>
  <div class="row sun-only"><button id="fire">触发耀斑</button></div>
  <div class="row sol-only">
    <div class="label">时间流速（空格暂停）</div>
    <div class="seg" id="speed">
      <button data-v="0" aria-pressed="false">1 天/秒</button>
      <button data-v="1" aria-pressed="true">30 天/秒</button>
      <button data-v="2" aria-pressed="false">1 年/秒</button>
    </div>
  </div>
  <div class="row sol-only">
    <div class="label">轨道线</div>
    <div class="seg" id="orbits">
      <button data-v="1" aria-pressed="true">开</button>
      <button data-v="0" aria-pressed="false">关</button>
    </div>
  </div>
  <div class="row sol-only">
    <div class="label">名称标注（点击名称可跟随）</div>
    <div class="seg" id="labelsw">
      <button data-v="1" aria-pressed="true">开</button>
      <button data-v="0" aria-pressed="false">关</button>
    </div>
  </div>
  <div class="row">
    <div class="label">画质</div>
    <div class="seg" id="quality">
      <button data-v="0" aria-pressed="false">低</button>
      <button data-v="1" aria-pressed="true">中</button>
      <button data-v="2" aria-pressed="false">高</button>
    </div>
  </div>
  <div class="row"><button id="fs">进入全屏</button></div>
</div>

<div id="readout" class="ui"></div>
<div id="hint" class="ui">拖拽旋转 · 滚轮缩放 · 1 / 2 / 3 切换场景 · F 全屏 · H 隐藏界面</div>
<div id="err"></div>

<script>
'use strict';
/* ------------------------------------------------------------------ *
 *  单位制: G = c = M = 1。视界 r=2，光子球 r=3，ISCO r=6。
 * ------------------------------------------------------------------ */
const VS = `#version 300 es
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const GLSL_COMMON = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform vec2  uRes;
uniform vec3  uCam, uRight, uUp, uFwd;
uniform float uTan, uTime, uStepScale, uMovie, uDisk;
uniform int   uSteps;

const float RIN  = 6.0;    // 最内稳定圆轨道 (ISCO)
const float ROUT = 16.0;
const float PI = 3.14159265359;

float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec3  hash33(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }

// 第二维带周期的值噪声（用于方位角，避免接缝）
float pnoise(vec2 p, float per){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float y0 = mod(i.y, per), y1 = mod(i.y + 1.0, per);
  return mix(mix(hash21(vec2(i.x, y0)), hash21(vec2(i.x + 1.0, y0)), f.x),
             mix(hash21(vec2(i.x, y1)), hash21(vec2(i.x + 1.0, y1)), f.x), f.y);
}
float diskNoise(float r, float phi){
  float a = phi / (2.0 * PI);
  float n = 0.0;
  n += 0.50 * pnoise(vec2(r * 0.9,        a * 6.0),  6.0);
  n += 0.25 * pnoise(vec2(r * 2.1 + 17.0, a * 12.0), 12.0);
  n += 0.15 * pnoise(vec2(r * 4.7 + 41.0, a * 24.0), 24.0);
  n += 0.10 * pnoise(vec2(r * 9.5 + 93.0, a * 48.0), 48.0);
  return n;
}

float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float n000 = hash33(i).x,                 n100 = hash33(i + vec3(1,0,0)).x;
  float n010 = hash33(i + vec3(0,1,0)).x,   n110 = hash33(i + vec3(1,1,0)).x;
  float n001 = hash33(i + vec3(0,0,1)).x,   n101 = hash33(i + vec3(1,0,1)).x;
  float n011 = hash33(i + vec3(0,1,1)).x,   n111 = hash33(i + vec3(1,1,1)).x;
  return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
             mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);
}

// 黑体色度近似 (1000K ~ 40000K)，返回线性 RGB
vec3 blackbody(float T){
  float t = clamp(T, 1000.0, 40000.0) / 100.0;
  float r = t <= 66.0 ? 1.0 : 1.29293618606 * pow(t - 60.0, -0.1332047592);
  float g = t <= 66.0 ? 0.39008157876 * log(t) - 0.63184144378 : 1.12989086089 * pow(t - 60.0, -0.0755148492);
  float b = t >= 66.0 ? 1.0 : (t <= 19.0 ? 0.0 : 0.54320678911 * log(t - 10.0) - 1.19625408914);
  return pow(clamp(vec3(r, g, b), 0.0, 1.0), vec3(2.2));
}

vec3 starLayer(vec3 d, float scale, float thresh){
  vec3 p = d * scale, id = floor(p);
  vec3 h = hash33(id);
  if (h.x < thresh) return vec3(0.0);
  vec3 pos = id + 0.2 + 0.6 * hash33(id + 7.31);
  float dist = length(p - pos);
  float s = 1.0 - smoothstep(0.0, 0.14, dist);
  float mag = pow(h.y, 6.0) * 5.0 + 0.25;
  return blackbody(mix(3200.0, 14000.0, h.z * h.z)) * s * s * mag;
}
vec3 background(vec3 d){
  vec3 c = vec3(0.0);
  c += starLayer(d, 70.0, 0.55);
  c += starLayer(d, 130.0, 0.5) * 0.7;
  c += starLayer(d, 220.0, 0.45) * 0.45;
  // 银河带
  vec3 ax = normalize(vec3(0.35, 0.9, 0.25));
  float lat = dot(d, ax);
  float n = vnoise3(d * 3.5) * 0.6 + vnoise3(d * 9.0) * 0.3 + vnoise3(d * 24.0) * 0.1;
  float band = exp(-lat * lat * 16.0) * smoothstep(0.25, 0.85, n);
  c += band * vec3(0.060, 0.050, 0.055);
  return c + 0.0015;
}

`;

const FS_SCENE = GLSL_COMMON + `
vec3 accel(vec3 x, float h2){
  float r2 = dot(x, x);
  return -3.0 * h2 * x / (r2 * r2 * sqrt(r2));
}

// 返回 rgb = 发光, a = 不透明度
vec4 shadeDisk(vec3 hit, float LzE, float r0){
  float r = length(hit.xz);
  if (r < RIN || r > ROUT) return vec4(0.0);
  float phi = atan(hit.z, hit.x);
  float om = pow(r, -1.5);                         // 开普勒角速度 Ω = sqrt(M/r^3)

  // 较差转动的条纹：两层相位交替淡入淡出，避免无限缠绕
  const float P = 90.0;
  float ph0 = fract(uTime / P), ph1 = fract(uTime / P + 0.5);
  float n0 = diskNoise(r, phi + om * (ph0 - 0.5) * P);
  float n1 = diskNoise(r + 31.7, phi + om * (ph1 - 0.5) * P + 2.4);
  float dens = mix(n1, n0, 1.0 - abs(2.0 * ph0 - 1.0));
  dens = smoothstep(0.22, 0.78, dens);

  // 标准薄盘辐射通量 F(r) ∝ r^-3 (1 - sqrt(r_in/r))，归一化到峰值 (r ≈ 8.17M)
  float F = (1.0 - sqrt(RIN / r)) / (r * r * r) / 2.623e-4;

  // 红移因子 g = ν_obs / ν_emit：引力红移 + 圆轨道多普勒，再换算到静止观察者
  float g = sqrt(1.0 - 3.0 / r) / max(1.0 - om * LzE, 0.05) / sqrt(1.0 - 2.0 / r0);

  vec3 emit;
  if (uMovie > 0.5) {
    float I = mix(F, 1.0, 0.45) * smoothstep(RIN, RIN + 0.5, r);
    emit = blackbody(3300.0 + 700.0 * pow(F, 0.25)) * I * 0.9;
  } else {
    float T = 6500.0 * pow(max(F, 1e-5), 0.25) * g;  // T_obs = g T_emit
    emit = blackbody(T) * F * g * g * g * g * 0.75;  // I_obs = g^4 I_emit
  }
  float edge = smoothstep(RIN, RIN + 0.35, r) * (1.0 - smoothstep(ROUT - 5.0, ROUT, r));
  emit *= 0.30 + 1.25 * dens * dens;
  float alpha = clamp(edge * (0.55 + 0.6 * dens), 0.0, 1.0);
  return vec4(emit, alpha);
}

void main(){
  vec2 uv = (vUv * 2.0 - 1.0) * vec2(uRes.x / uRes.y, 1.0) * uTan;
  vec3 d = normalize(uFwd + uv.x * uRight + uv.y * uUp);

  // 静止观察者的局域方向 -> 史瓦西坐标方向：径向分量乘 sqrt(1 - 2M/r)
  vec3 x = uCam;
  float r0 = length(x);
  vec3 rh = x / r0;
  float f0 = 1.0 - 2.0 / r0;
  float dr = dot(d, rh);
  vec3 dt_ = d - dr * rh;
  float sinPsi = length(dt_);
  vec3 v = normalize(dt_ + rh * dr * sqrt(f0));

  vec3 Lv = cross(x, v);
  float h2 = dot(Lv, Lv);
  // 光子的 L_z / E（反向追踪，光子动量与 v 反向）；瞄准参数 b = r sinψ / sqrt(f)
  float b = r0 * sinPsi / sqrt(f0);
  float LzE = h2 > 1e-10 ? -b * Lv.y / sqrt(h2) : 0.0;

  float rEsc = r0 + 30.0;
  vec3 col = vec3(0.0);
  float trans = 1.0;
  bool escaped = false;

  for (int i = 0; i < uSteps; i++) {
    float r = length(x);
    if (r < 2.0) break;                              // 落入事件视界
    if (r > rEsc && dot(x, v) > 0.0) { escaped = true; break; }

    float h = uStepScale * max(0.12 * (r - 1.8), 0.02) / length(v);
    // RK4 积分 d²x/dλ² = -3 h² x / r^5（史瓦西零测地线的空间轨迹）
    vec3 k1v = accel(x, h2),                    k1x = v;
    vec3 k2v = accel(x + 0.5 * h * k1x, h2),    k2x = v + 0.5 * h * k1v;
    vec3 k3v = accel(x + 0.5 * h * k2x, h2),    k3x = v + 0.5 * h * k2v;
    vec3 k4v = accel(x + h * k3x, h2),          k4x = v + h * k3v;
    vec3 xn = x + h / 6.0 * (k1x + 2.0 * k2x + 2.0 * k3x + k4x);
    vec3 vn = v + h / 6.0 * (k1v + 2.0 * k2v + 2.0 * k3v + k4v);

    if (uDisk > 0.5 && x.y * xn.y < 0.0) {           // 穿过赤道面
      float t = x.y / (x.y - xn.y);
      vec4 dk = shadeDisk(mix(x, xn, t), LzE, r0);
      col += trans * dk.a * dk.rgb;
      trans *= 1.0 - dk.a;
      if (trans < 0.01) break;
    }
    x = xn; v = vn;
  }
  if (escaped) col += trans * background(normalize(v));
  outColor = vec4(col, 1.0);
}`;

/* 太阳场景。单位: 太阳半径 R☉ = 1 */
const FS_SUN = GLSL_COMMON + `
uniform vec3  uAR[3];        // 活动区方向
uniform int   uFlareIdx;     // 正在爆发的活动区
uniform float uFlareT;       // 距耀斑触发的秒数
const float RMAX  = 4.6;
const float DEPTH = 0.06;    // 偶极子埋在光球下的深度
const float AR_SCALE[3] = float[3](1.0, 0.75, 1.25);
const vec3  TINT = vec3(1.0, 0.42, 0.10);   // 304Å 影像式的橙红假彩色
const vec3  HOT  = vec3(1.0, 0.80, 0.50);
vec3 gT[3], gB[3];

// 耀斑光变曲线：快速上升 + 指数衰减
float flash(float t){ return t < 0.0 ? 0.0 : (1.0 - exp(-t / 0.35)) * exp(-t / 6.0); }
// 抛射磁绳的高度：先加速，后近似匀速
float ropeL(float t){ return t < 1.5 ? 0.30 + 0.07 * t * t : 0.4575 + 0.21 * (t - 1.5); }

// 活动区的偶极磁场：返回该点所在磁力线的标号 L (r = L sin²θ)、绕偶极轴的方位角 psi、局部坐标 q
void arField(vec3 p, vec3 a, vec3 tg, vec3 bn, float s, out float L, out float psi, out vec3 q){
  vec3 d = (p - a * (1.0 - DEPTH * s)) / s;
  q = vec3(dot(d, tg), dot(d, a), dot(d, bn));
  float rho2 = q.y * q.y + q.z * q.z, r2 = q.x * q.x + rho2;
  L = r2 * sqrt(r2) / max(rho2, 1e-5);
  psi = atan(q.z, q.y);
}

vec3 shadeSurface(vec3 n, float mu){
  // 米粒组织与超米粒
  float gr  = vnoise3(n * 60.0 + vec3(0.0, uTime * 0.25, 0.0));
  float gr2 = vnoise3(n * 140.0 - vec3(uTime * 0.3));
  float sup = vnoise3(n * 9.0 + 3.0);
  float I = 0.66 + 0.38 * gr + 0.16 * gr2 + 0.22 * (sup - 0.5);
  float T = 5772.0;
  vec3 add = vec3(0.0);
  float fl = flash(uFlareT);
  for (int i = 0; i < 3; i++) {
    vec3 a = uAR[i]; float s = AR_SCALE[i];
    float da = length(n - a);
    if (da > 0.5 * s) continue;
    float d1 = length(n - normalize(a + gT[i] * 0.075 * s));
    float d2 = length(n - normalize(a - gT[i] * 0.075 * s));
    float dm = min(d1, d2) / s;
    float umbra = 1.0 - smoothstep(0.018, 0.032, dm);
    float pen   = 1.0 - smoothstep(0.035, 0.055, dm);
    float plage = (1.0 - smoothstep(0.08 * s, 0.4 * s, da)) * smoothstep(0.45, 0.8, vnoise3(n * 34.0 + 7.0));
    I += 0.30 * plage * (1.0 - pen);
    I *= mix(1.0, 0.72, pen);
    I *= mix(1.0, 0.23, umbra);                 // 黑子本影 (4000/5772)^4
    T = mix(T, 4000.0, umbra);
    if (i == uFlareIdx && fl > 0.002) {         // 耀斑亮带：随磁重联向外分开
      float L, psi; vec3 q;
      arField(n, a, gT[i], gB[i], s, L, psi, q);
      float Lr = 0.10 + 0.022 * uFlareT;
      float rib = exp(-pow((L - Lr) / 0.03, 2.0)) * (1.0 - smoothstep(0.7, 1.2, abs(psi)));
      add += rib * fl * vec3(5.0, 3.6, 2.2);
    }
  }
  vec3 ld = 1.0 - vec3(0.47, 0.62, 0.80) * (1.0 - mu);   // 临边昏暗，蓝端更强
  return blackbody(T) * TINT * I * ld * 0.85 + add;
}

// 光学薄的体发射系数
vec3 volume(vec3 p, float r){
  vec3 dir = p / r;
  float h = r - 1.0;
  float st = vnoise3(dir * 5.0 + 11.0);
  vec3 e = TINT * (1.1 * exp(-h / 0.03) + 0.10 * pow(r, -6.0) * (0.35 + 1.6 * st * st));
  float fl = flash(uFlareT);
  for (int i = 0; i < 3; i++) {
    vec3 a = uAR[i]; float s = AR_SCALE[i];
    bool isF = (i == uFlareIdx);
    bool erupt = isF && uFlareT < 16.0;
    float da = length(p - a);
    bool nearAR = da < 0.75 * s;
    if (!nearAR && !erupt) continue;
    float L, psi; vec3 q;
    arField(p, a, gT[i], gB[i], s, L, psi, q);
    if (nearAR) {
      // 冕环：沿偶极磁力线的细丝
      float win = 1.0 - smoothstep(0.6, 1.0, abs(psi));
      float strand = smoothstep(0.66, 0.86, vnoise3(vec3(L * 34.0, psi * 5.0, float(i) * 9.7 + uTime * 0.03)));
      float mask = smoothstep(0.07, 0.10, L) * (1.0 - smoothstep(0.30, 0.42, L));
      float amp = 9.0;
      vec3 c = TINT;
      if (isF) {                                  // 耀斑后环：重联过的磁力线被加热发亮
        float Lr = 0.10 + 0.022 * uFlareT;

vec3 albedo(int ty, vec3 m){

}`;

function orbitPoint(p, E){
  const xp = p.a * (Math.cos(E) - p.e), yp = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);
  const om = (p.w - p.O) * D2R, inc = p.I * D2R, Om = p.O * D2R;

  const X = (cO * cw - sO * sw * ci) * xp + (-cO * sw - sO * cw * ci) * yp;
  const Y = (sO * cw + cO * sw * ci) * xp + (-sO * sw + cO * cw * ci) * yp;

  return [X, Z, -Y];
}

  for (let k = 0; k < 8; k++) E -= (E - p.e * Math.sin(E) - M) / (1 - p.e * Math.cos(E));
  return orbitPoint(p, E);
}

    const r0 = state.dist, sinPsi = Math.sqrt(27) * Math.sqrt(1 - 2 / r0) / r0;
    const expected = 2 * Math.tan(Math.asin(sinPsi)) / Math.tan(FOV / 2) * (scene.h / 2);
    return { measuredPx: b - a + 1, expectedPx: +expected.toFixed(2), sceneW: scene.w, sceneH: scene.h, dist: r0 };
  },
};
</script>
